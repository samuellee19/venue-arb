[project]
name = "venue-arb"
version = "0.1.0"
description = "Cross-venue prediction-market matching and arbitrage research (Kalshi vs Polymarket)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "optiplex-platform",  # qa, obs and their pins (prefect, mlflow, OTel, DB clients)
    "pgvector>=0.4",
    "httpx>=0.27",
    "pydantic>=2.9",
    "anthropic>=0.70",
    "fastembed>=0.7",
    "numpy>=2.1",
    "matplotlib==3.11.2",
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.115", "uvicorn>=0.30", "duckdb>=1.1"]  # the public server (dashboard/api); no pipeline deps

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.15", "fastapi>=0.115", "uvicorn>=0.30", "duckdb>=1.1"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
optiplex-platform = { workspace = true }

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: needs the running platform stack (Postgres/ClickHouse/Prefect) and network",
]
