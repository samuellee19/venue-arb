[project]
name = "venue-arb"
version = "0.1.0"
description = "Cross-venue prediction-market matching and arbitrage research (Kalshi vs Polymarket)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "prefect==3.8.7",
    "psycopg[binary]>=3.3",
    "clickhouse-connect>=0.9",
    "pgvector>=0.4",
    "httpx>=0.27",
    "pydantic>=2.9",
    "anthropic>=0.70",
    "fastembed>=0.7",
    "numpy>=2.1",
    "matplotlib==3.11.2",
    "pyarrow>=25.0.1",
    "mlflow-skinny==3.16.1",
    "opentelemetry-sdk>=1.45.0",  # the platform obs package (PYTHONPATH) needs these three
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.115", "uvicorn>=0.30", "duckdb>=1.1"]  # the public server (dashboard/api); no pipeline deps

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.15", "fastapi>=0.115", "uvicorn>=0.30", "duckdb>=1.1"]

[tool.uv]
exclude-newer = "2026-10-05T00:00:00Z"   # supply-chain rule (platform): nothing newer than ~2 weeks; bump deliberately
default-groups = ["dev"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: needs the running platform stack (Postgres/ClickHouse/Prefect) and network",
]
