# This repository is a read-only mirror: requirements.txt is generated from the upstream lock, so CI needs no uv.lock
# and no platform. Tests that need the platform's qa/obs packages skip here.
name: ci
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - run: uv venv --python 3.14 .venv
      - run: uv pip install --python .venv/bin/python -r requirements.txt
      - run: .venv/bin/ruff check .
      - run: .venv/bin/pytest -m "not integration" -q
